# =============================================================================
# P2600L log sources & parser definitions (⚠️ SYNTHETIC — see model.yaml)
# =============================================================================
# Sources are P2600L's own (apl application log, jal journal, dgn diagnostics);
# they deliberately share nothing with P2600N (eCAT/CIM/Keeper/JOU) or
# P2800N (APP/JRN/SIU/IFM).
# =============================================================================

apl:
  name: P2600L application log
  description: Application flow log (bracket-level format).
  filename_patterns: ['(?i)p2600l[_-]?apl']
  parser:
    code: p2600l_apl
    type: line
    extensions: [txt, log]
    content_signatures: ['\[INF\]', '\[ERR\]']
    line_pattern: '^(?P<ts>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}) \[(?P<level>[A-Z]{3})\] (?P<msg>.*)$'
    timestamp_format: '%Y-%m-%d %H:%M:%S'
  key_extract:
    - key: txn_id
      pattern: '\btx[=:]([A-Za-z0-9_-]+)'
    - key: session_id
      pattern: '\bsn[=:]([A-Za-z0-9_-]+)'
    - key: amount
      pattern: '\bamt[=:]([0-9]+\.[0-9]{2})'
      type: float
    - key: currency
      pattern: '\bcur[=:]([A-Z]{3})'

jal:
  name: P2600L journal (JAL)
  description: '#seq|ts|txn|state|amount|CUR journal rows.'
  filename_patterns: ['(?i)p2600l[_-]?jal', '(?i)(?:^|[^a-z0-9])jal(?:$|[^a-z0-9])']
  parser:
    code: p2600l_jal
    type: line
    extensions: [txt, log]
    content_signatures: ['^#\d+\|']
    line_pattern: '^#(?P<jseq>\d+)\|(?P<ts>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})\|(?P<txn>[A-Za-z0-9_-]+)\|(?P<state>[A-Z_]+)\|(?P<amount>[0-9.]+)\|(?P<currency>[A-Z]{3})$'
    timestamp_format: '%Y-%m-%d %H:%M:%S'
  key_extract:
    - key: journal_seq
      pattern: '^#(\d+)\|'
      type: int
    - key: txn_id
      pattern: '\|([A-Za-z0-9_-]+)\|[A-Z_]+\|'
    - key: amount
      pattern: '\|([0-9]+\.[0-9]{2})\|[A-Z]{3}$'
      type: float
    - key: currency
      pattern: '\|([A-Z]{3})$'

dgn:
  name: P2600L diagnostics log
  description: Hardware component lines (motors, sensors, gates, jams).
  filename_patterns: ['(?i)p2600l[_-]?dgn', '(?i)(?:^|[^a-z0-9])dgn(?:$|[^a-z0-9])']
  parser:
    code: p2600l_dgn
    type: line
    extensions: [txt, log]
    content_signatures: ['^hw ']
    line_pattern: '^(?P<ts>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}) hw (?P<msg>.*)$'
    timestamp_format: '%Y-%m-%d %H:%M:%S'
  key_extract:
    - key: txn_id
      pattern: '\btx[=:]([A-Za-z0-9_-]+)'
