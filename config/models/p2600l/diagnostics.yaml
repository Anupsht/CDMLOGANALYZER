# =============================================================================
# P2600L diagnostic configuration (Phase 5 overlay) — ⚠️ SYNTHETIC patterns.
# Reuses P2600L's own tokens (amt=, notes=). Checks fire only when BOTH sides
# of a comparison are present; missing values are never invented.
# =============================================================================

reconciliation:
  tolerance: 0.01
  checks:
    inserted_amount:
      events: [CASH_INSERTED, CASH_ACCEPTED]
      pattern: 'amt[=:]([0-9]+(?:\.[0-9]+)?)'
      type: float
    counted_amount:
      events: [CASH_COUNTING_COMPLETED]
      pattern: 'amt[=:]([0-9]+(?:\.[0-9]+)?)'
      type: float
    inserted_notes:
      events: [CASH_INSERTED]
      pattern: 'notes[=:]([0-9]+)'
      type: int
    counted_notes:
      events: [CASH_COUNTING_COMPLETED]
      pattern: 'notes[=:]([0-9]+)'
      type: int
