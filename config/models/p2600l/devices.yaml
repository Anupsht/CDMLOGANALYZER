# =============================================================================
# P2600L device-name patterns (⚠️ SYNTHETIC names pending real docs)
# =============================================================================
patterns:
  - pattern: '\bAPL\b'
    device: P2600L-APL
  - pattern: '\bMOT[0-9]+\b'
    device: Motor-$0
  - pattern: '\bSN[0-9]+\b'
    device: Sensor-$0
  - pattern: '\bGATE[0-9]*\b'
    device: Gate
  - pattern: '\bBOX[0-9]*\b'
    device: Cassette-$0
